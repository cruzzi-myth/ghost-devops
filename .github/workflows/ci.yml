name: Ghost DevOps CI

on:
  push:
    branches: ["main", "fix/ghost-*"]
  pull_request:
    branches: ["main"]

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository }}

jobs:
  # ── .NET Gateway + Target App tests ────────────────────────────────────────
  dotnet-test:
    name: .NET Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore Gateway
        run: dotnet restore src/GhostDevOps.Gateway/GhostDevOps.Gateway.csproj

      - name: Build Gateway
        run: dotnet build src/GhostDevOps.Gateway/GhostDevOps.Gateway.csproj --no-restore -c Release

      - name: Build TargetApp
        run: dotnet build src/GhostDevOps.TargetApp/GhostDevOps.TargetApp.csproj -c Release

  # ── Python Brain lint + unit tests ─────────────────────────────────────────
  python-test:
    name: Python Brain Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r brain/requirements.txt pytest pytest-asyncio

      - name: Lint with ruff
        run: pip install ruff && ruff check brain/

      - name: Run unit tests
        run: pytest brain/tests/ -v
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        continue-on-error: true   # Don't fail CI if no test files yet

  # ── React Dashboard build ───────────────────────────────────────────────────
  dashboard-build:
    name: React Dashboard Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install
        run: cd dashboard && npm ci

      - name: Build
        run: cd dashboard && npm run build

  # ── Safety sandbox validation for AI-generated PRs ─────────────────────────
  ghost-safety-check:
    name: Ghost DevOps Safety Validation
    runs-on: ubuntu-latest
    if: contains(github.head_ref, 'fix/ghost-')
    steps:
      - uses: actions/checkout@v4

      - name: Scan for dangerous patterns
        run: |
          echo "🛡️ Running Ghost DevOps safety scan..."
          DANGEROUS_PATTERNS=("DROP TABLE" "DROP DATABASE" "rm -rf" "TRUNCATE" "format c:" "sudo chmod 777")
          FOUND=false
          for pattern in "${DANGEROUS_PATTERNS[@]}"; do
            if grep -r "$pattern" src/ --include="*.cs" -l 2>/dev/null; then
              echo "❌ BLOCKED: Dangerous pattern found: '$pattern'"
              FOUND=true
            fi
          done
          if [ "$FOUND" = true ]; then
            exit 1
          fi
          echo "✅ Safety scan passed — no dangerous patterns detected"
