apiVersion: apps/v1
kind: Deployment
metadata:
  name: target-app
  namespace: default
  labels:
    app: target-app
    managed-by: ghost-devops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: target-app
  template:
    metadata:
      labels:
        app: target-app
    spec:
      containers:
        - name: target-app
          image: ghcr.io/cruzzi-myth/ghost-devops/target-app:latest
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"   # Ghost DevOps monitors this — alert at 90%
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: target-app
  namespace: default
spec:
  selector:
    app: target-app
  ports:
    - port: 80
      targetPort: 8080
