global:
  resolve_timeout: 5m

route:
  group_by: ["alertname", "service"]
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: "ghost-devops-api"
  routes:
    - match:
        severity: critical
      receiver: "ghost-devops-api"
      continue: true
    - match:
        severity: warning
      receiver: "ghost-devops-api"

receivers:
  - name: "ghost-devops-api"
    webhook_configs:
      - url: "http://ghost-gateway:8080/api/alerts/receive"
        send_resolved: true
        http_config:
          follow_redirects: true
        max_alerts: 10
